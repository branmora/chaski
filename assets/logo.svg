<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="chaski">
  <title>chaski</title>
  <!-- Tile: undyed-cotton ground, so the mark reads on light and dark GitHub themes -->
  <rect width="96" height="96" rx="22" fill="#F3EDE3"/>
  <!-- Pendant cords = sub-issues (drawn first, so they hang from the primary cord) -->
  <g stroke-width="4.5" stroke-linecap="round">
    <!-- closed: ink, knotted -->
    <line x1="27" y1="29" x2="27" y2="74" stroke="#2A2420"/>
    <line x1="41" y1="29" x2="41" y2="66" stroke="#2A2420"/>
    <!-- ready: terracotta, the cord the runner carries next -->
    <line x1="55" y1="29" x2="55" y2="78" stroke="#C8553D"/>
    <!-- blocked: faint, unknotted -->
    <line x1="69" y1="29" x2="69" y2="60" stroke="#B9AE9F"/>
  </g>
  <g fill="#2A2420">
    <circle cx="27" cy="46" r="5"/>
    <circle cx="27" cy="60" r="5"/>
    <circle cx="41" cy="48" r="5"/>
  </g>
  <circle cx="55" cy="54" r="6.5" fill="#C8553D"/>
  <!-- Primary cord = the epic -->
  <line x1="17" y1="28" x2="79" y2="28" stroke="#2A2420" stroke-width="6" stroke-linecap="round"/>
</svg>
